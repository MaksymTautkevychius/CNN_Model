# This workflow installs dependencies (including PyTorch with CUDA),
# runs linting, and executes tests on Windows with multiple Python versions.

name: Python package (Windows with CUDA)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest matplotlib
        # Install PyTorch with CUDA 12.1 support (automatically chooses correct build)
        python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
        # Install from requirements.txt if present
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Lint with flake8
      run: |
        # Stop build on syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all other errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests (ignore if none found)
      run: |
        pytest || echo "No tests found — skipping."
